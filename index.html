<!doctype html>
<html>
<head>
  <meta charset="utf-8"/>
  <title>MetaShunt Interface</title>
  <link rel="stylesheet" href="./css/styles.css"/>
</head>
<body>
  <header class="topbar">
    <img src="./assets/metashuntLogo.png" alt="Logo" class="logo" />
    <button id="themeToggle" class="theme-toggle" aria-label="Toggle dark mode">Dark</button>
    <div id="status" class="status">
      <span class="dot"></span><span id="statusText">Ready</span>
    </div>
  </header>

  <div id="labelPopover" class="label-popover" style="display:none">
      <input id="labelPopoverText" type="text" placeholder="Label text…" maxlength="60"/>
      <button id="labelPopoverAdd">Add</button>
      <button id="labelPopoverCancel">✕</button>
    </div>

  <section class="controls">
    <div class="ctrl-section">
      <h4 class="ctrl-title">Measurement</h4>
      <div class="row">
        <div class="field">
          <label>Mode</label>
          <select id="mode">
            <option value="continuous">Continuous</option>
            <option value="burst">Burst</option>
          </select>
        </div>

        <div class="field mode-burst" style="display:none">
          <label>Freq (Hz)</label>
          <input type="number" id="burstHz" min="1" step="1" value="1000"/>
        </div>

        <div class="field mode-burst" style="display:none">
          <label>Trigger</label>
          <select id="trigger">
            <option value="immediate">Immediate</option>
            <option value="rising">Rising Current</option>
            <option value="falling">Falling Current</option>
            <option value="stage">Stage</option>
            <option value="manual">Manual (KEY2)</option>
          </select>
        </div>

        <div class="field mode-burst trig-current" style="display:none">
          <label>Level (µA)</label>
          <input type="number" id="triggerUA" step="1" value="1000"/>
        </div>

        <div class="field mode-burst trig-stage" style="display:none">
          <label>Stage #</label>
          <input type="number" id="stageIndex" min="0" step="1" value="0"/>
        </div>

        <div class="spacer"></div>

        <button id="startBtn" class="primary">Connect & Start</button>
        <button id="stopBtn" class="danger">Stop</button>
      </div>
    </div>

    <div class="ctrl-section">
      <h4 class="ctrl-title">Data &amp; Analysis</h4>
      <div class="row">
        <div class="field">
          <label>Device</label>
          <div id="deviceInfo" class="device-info">Not connected</div>
        </div>
        <div class="field">
          <label>Battery Capacity (mAh)</label>
          <input type="number" id="batteryMah" step="10" value="0"/>
        </div>
        <div class="spacer"></div>
        <button id="loadCsvBtn" class="ghost">Import Log</button>
        <button id="clearCsvBtn" class="ghost">Clear Log</button>
        <button id="plotMemoryBtn" class="ghost">View Entire Dataset</button>
        <button id="exportCsvBtn" class="ghost">Export CSV</button>
        <button id="exportImgsBtn" class="ghost">Export PNGs</button>
      </div>
    </div>

    <div class="ctrl-section">
      <div class="row">
        <button id="regionBtn" class="ghost">Region Cursors</button>
        <button id="collapseLabelsBtn" class="ghost collapse-btn">Labels ▾</button>
        <div class="spacer"></div>
      </div>

      <div id="labelsPanel" class="collapse-body">
        <div id="csvOffsetControl" style="display:none; align-items:center; gap:8px; margin-bottom:12px;">
          <label for="csvOffset">CSV offset (s):</label>
          <button id="csvOffsetDown">−</button>
          <input type="number" id="csvOffset" value="0" step="0.1" style="width:80px">
          <button id="csvOffsetUp">+</button>
        </div>
        <div class="row">
          <div class="spacer"></div>
          <button id="setRegionLabelBtn" class="ghost">Set Region Caption</button>
          <button id="clearLabelsBtn" class="ghost">Clear Labels</button>
        </div>
      </div>
    </div>

    <div id="statsPanel" class="stats-panel">
      <span class="stat-pill">Avg <b id="stAvg">--</b> µA</span>
      <span class="stat-pill">Min <b id="stMin">--</b> µA</span>
      <span class="stat-pill">Max <b id="stMax">--</b> µA</span>
      <span class="stat-pill">Std <b id="stSd">--</b></span>
      <span class="stat-pill">Charge <b id="stCharge">--</b> µAh</span>
      <span class="stat-pill">Batt life <b id="stBatt">--</b></span>
      <span id="stLive" class="stat-pill live">I: <b id="stLiveVal">0.00</b> <span id="stLiveUnit">µA</span></span>
      <span id="regionStats" class="stat-region"></span>
    </div>
  </section>

  <main class="plots">
    <div class="card">
      <div class="card-head">
        <h3>Current vs Time</h3>
        <span class="hint">µA</span>
      </div>
      <div id="plot-current" class="plot primary"></div>
    </div>

    <div class="card">
      <div class="card-head">
        <h3>Accumulated Charge</h3>
        <span class="hint" id="hint-charge">µAh</span>
      </div>
      <div id="plot-charge" class="plot primary"></div>
    </div>

    <div class="card">
      <div class="card-head">
        <h3>Occupancy</h3>
        <span class="hint" id="hint-cq">Time above level</span>
      </div>
      <div id="plot-cq" class="plot secondary"></div>
    </div>

    <div class="card">
      <div class="card-head">
        <h3>Current Distribution</h3>
        <span class="hint" id="hint-hist">Histogram</span>
      </div>
      <div id="plot-hist" class="plot secondary"></div>
    </div>

    <div class="card">
      <div class="card-head">
        <h3>Spectrum</h3>
        <span class="hint" id="hint-fft">FFT</span>
      </div>
      <div id="plot-fft" class="plot secondary"></div>
    </div>

    <div class="card">
      <div class="card-head">
        <h3>Energy Share by Current</h3>
        <span class="hint" id="hint-cdist">% of charge per bin</span>
      </div>
      <div id="plot-charge-dist" class="plot secondary"></div>
    </div>
  </main>

  <script src="./vendor/plotly.min.js"></script>
  <script type="module" src="./js/app.js"></script>
</body>
</html>
